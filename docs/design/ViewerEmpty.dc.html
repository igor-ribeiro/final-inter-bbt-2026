<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viewer — No baskets yet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
a{color:#8A9099}a:hover{color:#E6E8EB}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0B0D10; color: #E6E8EB; font-family: 'JetBrains Mono', ui-monospace, monospace; overflow: hidden">

  <header style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 12px; border-bottom: 1px solid #23272F">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: 0.14em; color: #8A9099">
      <span>FINAL · INTER BBT 2026</span>
      <span>NOT STARTED</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px">
      <div style="font-size: 12px; font-weight: 700; line-height: 1.3; color: #5EA2FF">PIVÔS DO CHURRASCO</div>
      <div style="display: flex; align-items: baseline; gap: 6px; font-size: 28px; font-weight: 800; color: #4A505A; font-variant-numeric: tabular-nums">
        <span>0</span><span style="font-size: 20px">–</span><span>0</span>
      </div>
      <div style="font-size: 12px; font-weight: 700; line-height: 1.3; text-align: right; color: #FF6B5E">INIMIGOS DA CESTA</div>
    </div>
  </header>

  <div style="width: 390px; height: 219px; background: #15181D; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#4A505A" stroke-width="2" aria-hidden="true"><rect x="4" y="9" width="32" height="22" rx="3"></rect><path d="M17 15v10l8-5z"></path></svg>
  </div>

  <div role="tablist" aria-label="Game views" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid #23272F">
    <button role="tab" aria-selected="true" style="height: 44px; background: none; border: 0; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #E6E8EB; box-shadow: inset 0 -2px 0 #E6E8EB">SCORING LOG</button>
    <button role="tab" aria-selected="false" style="height: 44px; background: none; border: 0; font: inherit; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #8A9099">BOX SCORE</button>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr); padding: 8px 12px; font-size: 10px; letter-spacing: 0.14em; color: #8A9099; border-bottom: 1px solid #23272F">
    <span style="text-align: right; color: #5EA2FF">PIVÔS</span>
    <span style="text-align: center">SCORE</span>
    <span style="color: #FF6B5E">INIMIGOS</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 32px 80px; text-align: center">
    <div style="font-size: 13px; color: #4A505A; letter-spacing: 0.1em">0 – 0</div>
    <div style="font-size: 15px; font-weight: 700">No baskets yet.</div>
    <div style="font-size: 12px; line-height: 1.6; color: #8A9099">Every made shot will show up here. Tap one to watch it.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
